      recorded here.
    official: true

third_party_note: >-
  npm also carries gainsight-px-mcp-server, gainsight-px-mcp and several
  @coretext-ai/* packages that wrap the Gainsight PX REST API. None are
  published from the Gainsight org and none are recorded as official.

