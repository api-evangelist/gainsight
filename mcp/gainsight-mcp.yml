    package: '@gainsight/gs-admin-cli'
    version: 1.0.10
    published: '2026-09-17'
    registry: npm
    mode: local-stdio
    repo: https://github.com/Gainsight/gs-admin-cli
    scope: JO Programs, Data Management and admin surfaces
    official: true
  - name: Staircase AI MCP connector
    surface: Anthropic Claude connector directory
    url: https://claude.com/connectors/gainsight-staircase-ai
    docs: https://support.gainsight.com/Staircase_AI/Staircase_AI_Features/Staircase_AI_MCP_Security_and_Compliance
    mode: remote
