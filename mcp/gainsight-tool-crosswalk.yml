crosswalk_note: >-
  THE HONEST FINDING IS A MISS, AND IT IS THE POINT OF THIS FILE. Gainsight
  publishes an MCP server and Gainsight publishes an OpenAPI — but not for the
  same product. The MCP server exposes Gainsight CS (companies, CTAs, Success
  Plans, Timeline), which has no machine-readable contract. The OpenAPI covers
  Gainsight PX, which has no MCP server of its own from Gainsight (the PX MCP
  packages on npm are third-party). So there is no operationId in this repo that
  any Gainsight MCP tool can be bound to. Every row below is therefore mapped by
  name and semantics against Gainsight's own CS documentation, at low confidence,
  and rest[] is empty by fact rather than by omission.

