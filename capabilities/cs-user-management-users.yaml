  - type: http
    namespace: cs-user-management-users
    baseUri: https://{domain}.gainsightcloud.com/v1
    description: Gainsight CS User Management API — Users business capability. Self-contained, no shared references.
    resources:
    - name: users
      path: /users
      operations:
      - name: listusers
        method: GET
        description: Gainsight List users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: pageNumber
          in: query
          type: integer
          description: Page number
        - name: pageSize
          in: query
          type: integer
          description: Records per page
    - name: users-userId
      path: /users/{userId}
      operations:
      - name: getuser
        method: GET
        description: Gainsight Get a user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateuser
        method: PUT
        description: Gainsight Update a user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: users-userId-deactivate
      path: /users/{userId}/deactivate
      operations:
      - name: deactivateuser
        method: POST
        description: Gainsight Deactivate a user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: accessKey
      value: '{{env.GAINSIGHT_API_KEY}}'
      placement: header
  exposes:
