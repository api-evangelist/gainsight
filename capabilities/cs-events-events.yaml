naftiko: 1.0.0-alpha2
info:
  label: Gainsight CS Events API — Events
  description: 'Gainsight CS Events API — Events. 3 operations. Lead operation: Gainsight Publish an event. Self-contained
    Naftiko capability covering one Gainsight business surface.'
  tags:
  - Gainsight
  - Events
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GAINSIGHT_API_KEY: GAINSIGHT_API_KEY
capability:
  consumes:
  - type: http
    namespace: cs-events-events
    baseUri: https://{domain}.gainsightcloud.com/v1
    description: Gainsight CS Events API — Events business capability. Self-contained, no shared references.
    resources:
    - name: events
      path: /events
      operations:
      - name: publishevent
        method: POST
        description: Gainsight Publish an event
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: events-bulk
      path: /events/bulk
      operations:
      - name: publisheventsbulk
        method: POST
        description: Gainsight Bulk publish events
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: events-types
      path: /events/types
      operations:
      - name: listeventtypes
        method: GET
        description: Gainsight List event types
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: accessKey
      value: '{{env.GAINSIGHT_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: cs-events-events-rest
    port: 8080
    description: REST adapter for Gainsight CS Events API — Events. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/events
      name: events
      description: REST surface for events.
      operations:
      - method: POST
        name: publishevent
        description: Gainsight Publish an event
        call: cs-events-events.publishevent
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events/bulk
      name: events-bulk
      description: REST surface for events-bulk.
      operations:
      - method: POST
        name: publisheventsbulk
        description: Gainsight Bulk publish events
        call: cs-events-events.publisheventsbulk
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events/types
      name: events-types
      description: REST surface for events-types.
      operations:
      - method: GET
        name: listeventtypes
        description: Gainsight List event types
        call: cs-events-events.listeventtypes
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cs-events-events-mcp
    port: 9090
    transport: http
    description: MCP adapter for Gainsight CS Events API — Events. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: gainsight-publish-event
      description: Gainsight Publish an event
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cs-events-events.publishevent
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: gainsight-bulk-publish-events
      description: Gainsight Bulk publish events
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cs-events-events.publisheventsbulk
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: gainsight-list-event-types
      description: Gainsight List event types
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cs-events-events.listeventtypes
      outputParameters:
      - type: object
        mapping: $.
