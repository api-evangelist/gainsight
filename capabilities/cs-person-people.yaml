      description: Gainsight Get a person record
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cs-person-people.getperson
      outputParameters:
      - type: object
        mapping: $.
    - name: gainsight-delete-person-record
      description: Gainsight Delete a person record
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: cs-person-people.deleteperson
      outputParameters:
      - type: object
        mapping: $.
