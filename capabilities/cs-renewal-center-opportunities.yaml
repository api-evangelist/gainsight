    resources:
    - name: data-objects-Opportunity
      path: /data/objects/Opportunity
      operations:
      - name: createopportunity
        method: POST
        description: Gainsight Create an opportunity
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: updateopportunity
        method: PUT
        description: Gainsight Update opportunities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: keys
          in: query
          type: string
          description: Comma-separated key fields for matching
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: data-objects-Opportunity-search
      path: /data/objects/Opportunity/search
