naftiko: 1.0.0-alpha2
info:
  label: Gainsight CS Data Management API — Fields
  description: 'Gainsight CS Data Management API — Fields. 2 operations. Lead operation: Gainsight List fields for an object.
    Self-contained Naftiko capability covering one Gainsight business surface.'
  tags:
  - Gainsight
  - Fields
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GAINSIGHT_API_KEY: GAINSIGHT_API_KEY
capability:
  consumes:
  - type: http
    namespace: cs-data-management-fields
    baseUri: https://{domain}.gainsightcloud.com/v1
    description: Gainsight CS Data Management API — Fields business capability. Self-contained, no shared references.
    resources:
    - name: meta-objects-objectName-fields
      path: /meta/objects/{objectName}/fields
      operations:
      - name: listfields
        method: GET
        description: Gainsight List fields for an object
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: meta-objects-objectName-fields-fieldName
      path: /meta/objects/{objectName}/fields/{fieldName}
      operations:
      - name: getfield
        method: GET
        description: Gainsight Get field metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: accessKey
      value: '{{env.GAINSIGHT_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: cs-data-management-fields-rest
    port: 8080
    description: REST adapter for Gainsight CS Data Management API — Fields. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/meta/objects/{objectname}/fields
      name: meta-objects-objectname-fields
      description: REST surface for meta-objects-objectName-fields.
      operations:
      - method: GET
        name: listfields
        description: Gainsight List fields for an object
        call: cs-data-management-fields.listfields
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/meta/objects/{objectname}/fields/{fieldname}
      name: meta-objects-objectname-fields-fieldname
      description: REST surface for meta-objects-objectName-fields-fieldName.
      operations:
      - method: GET
        name: getfield
        description: Gainsight Get field metadata
        call: cs-data-management-fields.getfield
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cs-data-management-fields-mcp
    port: 9090
    transport: http
    description: MCP adapter for Gainsight CS Data Management API — Fields. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: gainsight-list-fields-object
      description: Gainsight List fields for an object
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cs-data-management-fields.listfields
      outputParameters:
      - type: object
        mapping: $.
    - name: gainsight-get-field-metadata
      description: Gainsight Get field metadata
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cs-data-management-fields.getfield
      outputParameters:
      - type: object
        mapping: $.
