api_billing:
  metered: false
  note: >-
    No plan meters or prices API calls. API throughput is capped by the tenant
    rate limit (see rate-limits/gainsight-rate-limits.yml), which is not
    published as varying by tier. Sandbox environments are a separately purchased
    license rather than a plan inclusion, except for Skilljar Enterprise.
