tags:
  - Customer Success
  - Customer Health
description: >-
  Gainsight publishes a tiered plan structure across four product lines but no
  price on any tier — every plan is "contact us". Quotas are published (full
  users, customers per user, academy sites, admin seats), which makes the tiers
  comparable even without a number. Nothing is metered on API calls; API access
  is a platform capability governed by the tenant rate limit, not a billed line
  item.

