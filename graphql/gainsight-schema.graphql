"""
Gainsight GraphQL Schema
Conceptual schema derived from the Gainsight Customer Success Platform REST APIs:
- Gainsight CS NXT API (gainsightcloud.com)
- Gainsight PX API (aptrinsic.com)
- Gainsight Bulk API
Reference: https://support.gainsight.com/SFDC_Edition/API_and_Developer_Docs/
"""

# ─── Scalars ────────────────────────────────────────────────────────────────

scalar DateTime
scalar JSON
scalar Upload

# ─── Enums ──────────────────────────────────────────────────────────────────

enum RiskSeverity {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

enum RiskCategory {
  ADOPTION
  ENGAGEMENT
  FINANCIAL
  PRODUCT
  RELATIONSHIP
  SUPPORT
}

enum TaskStatus {
  OPEN
  IN_PROGRESS
  COMPLETED
  SKIPPED
  OVERDUE
}

enum AlertType {
  HEALTH_SCORE_CHANGE
  RENEWAL_UPCOMING
  USAGE_DROP
  SURVEY_RESPONSE
  RISK_IDENTIFIED
  MILESTONE_REACHED
  CUSTOM
}

enum AlertSeverity {
  INFO
  WARNING
  CRITICAL
}

enum ActivityType {
  CALL
  EMAIL
  MEETING
  NOTE
  IN_PERSON
  SCREEN_SHARE
  QBR
  OTHER
}

enum QuestionType {
  TEXT
  MULTIPLE_CHOICE
  RATING
  NPS
  YES_NO
  DROPDOWN
  DATE
  NUMBER
}

enum RenewalStatus {
  OPEN
  AT_RISK
  COMMITTED
  CLOSED_WON
  CLOSED_LOST
  CHURNED
}

enum ContactRole {
  CHAMPION
  ECONOMIC_BUYER
  EXECUTIVE_SPONSOR
  END_USER
  TECHNICAL_CONTACT
  DECISION_MAKER
  INFLUENCER
}

# ─── Account & Company Types ─────────────────────────────────────────────────

"""Core account record representing a customer company."""
type Account {
  id: ID!
  name: String!
  domain: String
  industry: String
  region: String
  tier: String
  arr: Float
  mrr: Float
  employees: Int
  startDate: DateTime
  renewalDate: DateTime
  healthScore: HealthScore
  details: AccountDetails
  contacts: [Contact!]
  csm: CSM
  risks: [Risk!]
  opportunities: [Opportunity!]
  timelines: [Timeline!]
  playbooks: [Playbook!]
  surveys: [Survey!]
  metrics: [Metric!]
  licenses: [License!]
  renewals: [Renewal!]
  segments: [Segment!]
  usageData: UsageData
  features: [Feature!]
  tags: [String!]
  customFields: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Extended attributes and metadata for an account."""
type AccountDetails {
  accountId: ID!
  website: String
  phone: String
  address: String
  city: String
  state: String
  country: String
  postalCode: String
  parentAccountId: ID
  accountType: String
  contractStartDate: DateTime
  contractEndDate: DateTime
  gsid: String
  crmId: String
  npsScore: Float
  lifetimeValue: Float
  productVersion: String
  supportTier: String
  notes: String
}

"""Aggregated health information for an account."""
type AccountHealth {
  accountId: ID!
  overallScore: Float!
  trend: String
  colorCode: String
  previousScore: Float
  scoreDate: DateTime!
  factors: [HealthScoreFactor!]!
  lastCalculated: DateTime!
}

"""Numerical scorecard value for an account's health."""
type AccountScore {
  id: ID!
  accountId: ID!
  scoreName: String!
  value: Float!
  weight: Float
  calculatedAt: DateTime!
  trend: String
}

# ─── Health Score Types ───────────────────────────────────────────────────────

"""Overall health score record for a customer account."""
type HealthScore {
  id: ID!
  accountId: ID!
  score: Float!
  colorCode: String!
  label: String
  trend: String
  previousScore: Float
  scoreDate: DateTime!
  factors: [HealthScoreFactor!]!
  updatedAt: DateTime!
}

"""An individual contributing factor to a health score."""
type HealthScoreFactor {
  id: ID!
  healthScoreId: ID!
  name: String!
  category: String
  weight: Float!
  score: Float!
  colorCode: String
  trend: String
  description: String
  lastUpdated: DateTime!
}

# ─── Customer & Contact Types ─────────────────────────────────────────────────

"""Detailed customer profile record."""
type CustomerDetails {
  id: ID!
  accountId: ID!
  customerSince: DateTime
  lifetimeValue: Float
  totalOpportunities: Int
  openCTAs: Int
  healthScore: Float
  npsScore: Float
  lastActivityDate: DateTime
  engagementScore: Float
  customAttributes: JSON
}

"""A person who is a contact at a customer account."""
type Contact {
  id: ID!
  accountId: ID!
  firstName: String!
  lastName: String!
  email: String
  phone: String
  title: String
  department: String
  role: ContactRole
  isPrimary: Boolean
  details: ContactDetails
  activities: [ContactActivity!]
  npsResponses: [NPSScore!]
  surveyResponses: [SurveyResponse!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Extended attributes for a contact record."""
type ContactDetails {
  contactId: ID!
  linkedInUrl: String
  twitterHandle: String
  timezone: String
  preferredContactMethod: String
  doNotContact: Boolean
  optOutEmail: Boolean
  lastContactDate: DateTime
  crmContactId: String
  gsid: String
  notes: String
  customFields: JSON
}

"""An activity or interaction associated with a contact."""
type ContactActivity {
  id: ID!
  contactId: ID!
  accountId: ID!
  type: ActivityType!
  subject: String
  description: String
  occurredAt: DateTime!
  csmId: ID
  duration: Int
  outcome: String
}

# ─── CSM (Customer Success Manager) Types ────────────────────────────────────

"""A Customer Success Manager user record."""
type CSM {
  id: ID!
  firstName: String!
  lastName: String!
  email: String!
  title: String
  region: String
  details: CSMDetails
  team: CSMTeam
  accounts: [Account!]
  tasks: [Task!]
