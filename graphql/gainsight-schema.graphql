  updatedAt: DateTime!
}

"""Extended profile information for a CSM."""
type CSMDetails {
  csmId: ID!
  phone: String
  timezone: String
  capacity: Int
  currentAccountCount: Int
  totalARR: Float
  averageHealthScore: Float
  openCTACount: Int
  managerName: String
  department: String
}

"""A team grouping of Customer Success Managers."""
type CSMTeam {
  id: ID!
  name: String!
  description: String
  region: String
  members: [CSM!]!
