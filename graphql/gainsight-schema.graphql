  createdAt: DateTime!
}

# ─── Risk Types ───────────────────────────────────────────────────────────────

"""A risk record associated with a customer account."""
type Risk {
  id: ID!
  accountId: ID!
  name: String!
  description: String
  type: RiskType!
  severity: RiskSeverity!
  category: RiskCategory!
  details: RiskDetails
  status: String
  ownerId: ID
  dueDate: DateTime
  resolvedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Detailed attributes of a risk record."""
type RiskDetails {
  riskId: ID!
  impactDescription: String
  mitigationPlan: String
  likelihood: String
  impact: String
  riskScore: Float
  escalated: Boolean
  escalationDate: DateTime
  comments: String
  linkedCTAId: ID
  customFields: JSON
}

"""Classification type for a risk."""
type RiskType {
  id: ID!
  name: String!
  description: String
  category: RiskCategory
  defaultSeverity: RiskSeverity
  isActive: Boolean!
}

# ─── Timeline Types ───────────────────────────────────────────────────────────

"""A timeline record grouping activities for an account."""
type Timeline {
  id: ID!
  accountId: ID!
  name: String
  description: String
  activities: [TimelineActivity!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""An individual activity entry on a customer timeline."""
type TimelineActivity {
  id: ID!
  accountId: ID!
  timelineId: ID
  type: ActivityType!
  subject: String!
  description: String
  occurredAt: DateTime!
  authorId: ID!
  attendees: [Contact!]
  duration: Int
  isExternal: Boolean
  notes: [Note!]
  meetingNotes: MeetingNote
  tags: [String!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ─── Note Types ───────────────────────────────────────────────────────────────

"""A freeform note attached to an account, contact, or activity."""
type Note {
  id: ID!
  accountId: ID
  contactId: ID
  activityId: ID
  content: String!
  authorId: ID!
  isPinned: Boolean
  visibility: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Structured notes captured from a customer meeting."""
type MeetingNote {
  id: ID!
  activityId: ID!
  agenda: String
  summary: String
  actionItems: [String!]
  decisions: [String!]
  nextSteps: String
  attendeeCount: Int
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ─── Playbook & Task Types ────────────────────────────────────────────────────

"""A Gainsight Playbook defining a structured success workflow."""
type Playbook {
  id: ID!
  name: String!
  description: String
  details: PlaybookDetails
  steps: [PlaybookStep!]!
  tasks: [Task!]!
  isActive: Boolean!
  version: Int
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Metadata and configuration for a Playbook."""
type PlaybookDetails {
  playbookId: ID!
  category: String
  objective: String
  estimatedDuration: Int
  applicableSegments: [String!]
  triggerConditions: JSON
  successCriteria: String
  ownerRole: String
  isTemplate: Boolean
}

"""A step within a Playbook, containing one or more tasks."""
type PlaybookStep {
  id: ID!
  playbookId: ID!
  name: String!
  description: String
  order: Int!
  dueOffsetDays: Int
  tasks: [Task!]!
  isRequired: Boolean
}

"""A Task representing an actionable item for a CSM."""
type Task {
  id: ID!
  accountId: ID!
  playbookId: ID
  stepId: ID
  ctaId: ID
  name: String!
  description: String
  status: TaskStatus!
  details: TaskDetails
  assigneeId: ID
  dueDate: DateTime
  completedAt: DateTime
  priority: Int
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Additional attributes of a Task record."""
type TaskDetails {
  taskId: ID!
  type: String
  comments: String
  associatedContactId: ID
  associatedOpportunityId: ID
  estimatedEffortHours: Float
  isRecurring: Boolean
  recurrencePattern: String
  completionNotes: String
  customFields: JSON
}

# ─── Cockpit & Alert Types ────────────────────────────────────────────────────

"""The Gainsight Cockpit — a prioritized view of CTAs and alerts for a CSM."""
type Cockpit {
  id: ID!
  csmId: ID!
  alerts: [Alert!]!
  tasks: [Task!]!
  totalOpenCTAs: Int!
  overdueCount: Int!
  highPriorityCount: Int!
  lastRefreshed: DateTime!
}

"""A Call To Action (CTA) or system-generated alert."""
type Alert {
  id: ID!
  accountId: ID!
  name: String!
  description: String
  type: AlertType!
  severity: AlertSeverity!
  status: String!
  details: AlertDetails
  assigneeId: ID
  dueDate: DateTime
  triggeredAt: DateTime!
  resolvedAt: DateTime
  playbookId: ID
  tasks: [Task!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Extended data for an Alert/CTA record."""
type AlertDetails {
  alertId: ID!
  triggerCondition: String
  triggerValue: Float
  currentValue: Float
  threshold: Float
  reasonCode: String
  priority: Int
  snoozeUntil: DateTime
  closureReason: String
  comments: String
  customFields: JSON
}

# ─── Survey Types ─────────────────────────────────────────────────────────────

"""A survey sent to customer contacts."""
type Survey {
  id: ID!
  accountId: ID
  name: String!
  description: String
  details: SurveyDetails
  questions: [Question!]!
  responses: [SurveyResponse!]!
  status: String!
  sentAt: DateTime
  closedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Metadata and configuration for a Survey."""
type SurveyDetails {
  surveyId: ID!
  type: String
  targetAudience: String
  sendMethod: String
  reminderSchedule: String
  anonymousResponses: Boolean
  responseRate: Float
  averageScore: Float
  totalSent: Int
  totalResponded: Int
}

"""A single response to a survey from a contact."""
type SurveyResponse {
  id: ID!
  surveyId: ID!
  contactId: ID!
  accountId: ID!
  answers: [Answer!]!
  submittedAt: DateTime!
  npsScore: Int
  comments: String
  sentiment: String
  createdAt: DateTime!
}

"""A question within a survey."""
type Question {
  id: ID!
  surveyId: ID!
  text: String!
  type: QuestionType!
  isRequired: Boolean!
  order: Int!
  options: [String!]
  minRating: Int
  maxRating: Int
  placeholder: String
}

"""An answer to a specific survey question."""
type Answer {
  id: ID!
  questionId: ID!
  responseId: ID!
  value: String
  numericValue: Float
  selectedOptions: [String!]
  answeredAt: DateTime!
}

# ─── NPS Types ───────────────────────────────────────────────────────────────

"""An NPS (Net Promoter Score) record for a contact."""
type NPS {
  id: ID!
  accountId: ID!
  contactId: ID!
  score: Int!
  comment: String
  category: String
  surveyId: ID
