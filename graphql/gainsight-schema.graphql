# ─── Feature & Usage Types ────────────────────────────────────────────────────

"""A product feature tracked for adoption."""
type Feature {
  id: ID!
  name: String!
  description: String
  category: String
  releaseDate: DateTime
  isActive: Boolean!
  usageData: [FeatureUsage!]
  adoptionData: FeatureAdoption
}

"""Usage statistics for a specific feature by an account."""
type FeatureUsage {
  id: ID!
  featureId: ID!
  accountId: ID!
  usageCount: Int!
  uniqueUsers: Int
  lastUsedAt: DateTime
  periodStart: DateTime!
  periodEnd: DateTime!
  trend: String
}

"""Aggregated adoption metrics for a feature."""
type FeatureAdoption {
  featureId: ID!
  accountId: ID!
  adoptionPercentage: Float!
  activeUsers: Int!
  totalUsers: Int!
  firstAdoptedAt: DateTime
  lastActivityAt: DateTime
  adoptionTrend: String
}

# ─── Metric Types ─────────────────────────────────────────────────────────────

"""A named metric tracked for a customer account."""
type Metric {
  id: ID!
  accountId: ID!
  name: String!
  value: Float!
  unit: String
  details: MetricDetails
  trend: MetricTrend
  recordedAt: DateTime!
  createdAt: DateTime!
}

"""Detailed configuration and context for a Metric."""
type MetricDetails {
  metricId: ID!
  category: String
  source: String
  formula: String
  target: Float
  threshold: Float
  description: String
  isCustom: Boolean
  frequency: String
}

"""Trend data for a metric over time."""
type MetricTrend {
  metricId: ID!
  accountId: ID!
  direction: String
  percentageChange: Float
  previousValue: Float
  currentValue: Float
  periodStart: DateTime!
  periodEnd: DateTime!
