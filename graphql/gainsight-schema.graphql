# ─── Journey & Segment Types ──────────────────────────────────────────────────

"""A digital journey orchestrating in-app engagement for users."""
type Journey {
  id: ID!
  name: String!
  description: String
  details: JourneyDetails
  isActive: Boolean!
  startDate: DateTime
  endDate: DateTime
  targetSegments: [Segment!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Configuration and metrics for a digital Journey."""
type JourneyDetails {
  journeyId: ID!
  triggerEvent: String
  goalEvent: String
  steps: [JSON!]
  totalEnrolled: Int
  totalCompleted: Int
  completionRate: Float
  averageDuration: Float
  status: String
}

"""A named segment of accounts or users for targeting."""
type Segment {
  id: ID!
  name: String!
  description: String
  details: SegmentDetails
  accountCount: Int
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Rules and metadata for a Segment definition."""
type SegmentDetails {
  segmentId: ID!
  criteriaType: String
  criteria: JSON
  accountIds: [ID!]
  lastRefreshedAt: DateTime
  isDynamic: Boolean
  tags: [String!]
}

# ─── Root Types ───────────────────────────────────────────────────────────────

type Query {
  # Account queries
  account(id: ID!): Account
  accounts(
    limit: Int
    offset: Int
    filter: JSON
    sort: String
  ): [Account!]!
  accountHealth(accountId: ID!): AccountHealth
  accountScore(accountId: ID!): AccountScore

  # Customer details
  customerDetails(accountId: ID!): CustomerDetails

  # Contact queries
  contact(id: ID!): Contact
  contacts(accountId: ID, limit: Int, offset: Int): [Contact!]!

  # CSM queries
  csm(id: ID!): CSM
  csms(region: String, teamId: ID): [CSM!]!
  csmTeam(id: ID!): CSMTeam
  csmTeams: [CSMTeam!]!

  # Risk queries
  risk(id: ID!): Risk
  risks(accountId: ID, severity: RiskSeverity, category: RiskCategory): [Risk!]!

  # Timeline queries
  timeline(id: ID!): Timeline
  timelines(accountId: ID!): [Timeline!]!
  timelineActivity(id: ID!): TimelineActivity

  # Playbook & Task queries
  playbook(id: ID!): Playbook
  playbooks(isActive: Boolean): [Playbook!]!
  task(id: ID!): Task
  tasks(accountId: ID, status: TaskStatus, assigneeId: ID): [Task!]!

  # Cockpit queries
  cockpit(csmId: ID!): Cockpit
  alert(id: ID!): Alert
  alerts(accountId: ID, type: AlertType, severity: AlertSeverity): [Alert!]!

  # Survey queries
  survey(id: ID!): Survey
  surveys(accountId: ID, status: String): [Survey!]!
  surveyResponse(id: ID!): SurveyResponse
  surveyResponses(surveyId: ID!): [SurveyResponse!]!

  # NPS queries
  nps(accountId: ID!, contactId: ID): [NPS!]!
  npsSurvey(id: ID!): NPSSurvey
  npsSurveys(accountId: ID): [NPSSurvey!]!

  # Health score queries
  healthScore(accountId: ID!): HealthScore
  healthScoreFactors(healthScoreId: ID!): [HealthScoreFactor!]!

  # Renewal queries
  renewal(id: ID!): Renewal
  renewals(accountId: ID, status: RenewalStatus): [Renewal!]!

  # Opportunity queries
  opportunity(id: ID!): Opportunity
  opportunities(accountId: ID, stage: String): [Opportunity!]!

  # Feature & Usage queries
  feature(id: ID!): Feature
  features(isActive: Boolean): [Feature!]!
  featureUsage(featureId: ID!, accountId: ID!): FeatureUsage
  usageData(accountId: ID!): UsageData
  userActivities(accountId: ID!, limit: Int): [UserActivity!]!

  # Metric queries
  metric(id: ID!): Metric
  metrics(accountId: ID!, category: String): [Metric!]!

  # License queries
  license(id: ID!): License
  licenses(accountId: ID!): [License!]!

  # Webhook queries
  webhook(id: ID!): Webhook
  webhooks: [Webhook!]!

  # Journey & Segment queries
  journey(id: ID!): Journey
  journeys(isActive: Boolean): [Journey!]!
  segment(id: ID!): Segment
  segments(isActive: Boolean): [Segment!]!

  # Auth queries
  apiKeys: [APIKey!]!
}

type Mutation {
  # Account mutations
  upsertAccount(input: JSON!): Account
  updateAccountHealth(accountId: ID!, input: JSON!): AccountHealth

  # Contact mutations
  upsertContact(input: JSON!): Contact
  deleteContact(id: ID!): Boolean

  # Risk mutations
  createRisk(accountId: ID!, input: JSON!): Risk
  updateRisk(id: ID!, input: JSON!): Risk
  resolveRisk(id: ID!): Risk

  # Timeline mutations
  createTimelineActivity(accountId: ID!, input: JSON!): TimelineActivity
  updateTimelineActivity(id: ID!, input: JSON!): TimelineActivity
