  contactId: ID!
  accountId: ID!
  score: Int!
  label: String
  comment: String
  detractorReason: String
  promoterReason: String
  submittedAt: DateTime!
}

"""An NPS survey instance and its aggregate results."""
type NPSSurvey {
  id: ID!
  name: String!
  accountId: ID
  sentAt: DateTime!
  closedAt: DateTime
  totalSent: Int!
  totalResponded: Int!
  promoters: Int!
  passives: Int!
  detractors: Int!
  npsScore: Float!
  responses: [NPS!]!
