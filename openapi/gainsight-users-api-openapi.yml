openapi: 3.2.0
info:
  title: Gainsight Users API
  version: '1.0'
  description: 'Operations tagged Users across 3 of this provider''s published API definitions: gainsight-cs-user-management-api-openapi.yml, gainsight-px-api-openapi.yml, gainsight-users-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{domain}.gainsightcloud.com/v1
  description: Gainsight CS Production
  variables:
    domain:
      default: customer
      description: Customer-specific domain prefix
- url: https://api.aptrinsic.com/v1
  description: Gainsight PX Production API
- url: https://api.aptrinsic.com/
tags:
- name: Users
  description: Manage Gainsight users
paths:
  /users:
    get:
      operationId: listUsers
      summary: Gainsight List users
      description: Retrieve a list of Gainsight users.
      tags:
      - Users
      parameters:
      - name: pageNumber
        in: query
        description: Page number
        schema:
          type: integer
          default: 0
      - name: pageSize
        in: query
        description: Records per page
        schema:
          type: integer
          default: 25
      responses:
        '200':
          description: Users returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                  data:
                    type: object
                    properties:
                      records:
                        type: array
                        items:
                          $ref: '#/components/schemas/GainsightUser'
                      totalCount:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - apiKey: []
    post:
      operationId: createUser
      summary: Gainsight Create or update a user
      description: Create a new user or update an existing user in Gainsight PX.
      tags:
      - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: User created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
      security:
      - apiKey: []
    servers:
    - url: https://{domain}.gainsightcloud.com/v1
      description: Gainsight CS Production
      variables:
        domain:
          default: customer
          description: Customer-specific domain prefix
  /users/{userId}:
    get:
      operationId: getUser
      summary: Gainsight Get a user
      description: Retrieve a specific Gainsight user by ID.
      tags:
      - Users
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: User returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/GainsightUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - apiKey: []
    put:
      operationId: updateUser
      summary: Gainsight Update a user
      description: Update a Gainsight user record.
      tags:
      - Users
      parameters:
      - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GainsightUserInput'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - apiKey: []
    patch:
      operationId: patchUsersByUserId
      summary: Gainsight Update a user
      description: Update specific attributes of a user.
      tags:
      - Users
      parameters:
      - $ref: '#/components/parameters/userId_2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - apiKey: []
      x-operation-id-source: normalized
      x-operation-id-original: updateUser
    delete:
      operationId: deleteUser
      summary: Gainsight Delete a user
      description: Delete a user from Gainsight PX.
      tags:
      - Users
      parameters:
      - $ref: '#/components/parameters/userId_2'
      responses:
        '204':
          description: User deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - apiKey: []
    servers:
    - url: https://{domain}.gainsightcloud.com/v1
      description: Gainsight CS Production
      variables:
        domain:
          default: customer
          description: Customer-specific domain prefix
  /users/{userId}/deactivate:
    post:
      operationId: deactivateUser
      summary: Gainsight Deactivate a user
      description: Deactivate a Gainsight user account.
      tags:
      - Users
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - apiKey: []
    servers:
    - url: https://{domain}.gainsightcloud.com/v1
      description: Gainsight CS Production
      variables:
        domain:
          default: customer
          description: Customer-specific domain prefix
  /v1/users:
    servers:
    - url: https://api.aptrinsic.com/
    get:
      tags:
      - Users
      summary: Get users
      description: 'Retrieves users. Supports filtering, sorting and paging.

        ### Filtering

        The filter parameter accepts a list of semicolon-separated filters in the form: {fieldName}{operator}{fieldValue}

        Filter terms within a single filter parameter are joined by a logical AND.

        Separate filter parameters are joined by a logical OR.

        #### Operators

        | Operator | Meaning |

        | ----- | -------- |

        | == | Exact match |

        | != | Not equal |

        | | Greater than |

        | >= | Greater than or equal |

        | ~ | Matches string, supports wildcard characters * and ? |

        | !~ | Not like, supports wildcard characters * and ? |


        Examples:


        | URI | Results |

        | ----- | -------- |

        | GET /v1/users?filter=lastName==Doe;firstName==John | Users with firstName of ''John'' AND lastName of ''Doe''. |

        | GET /v1/users?filter=firstName==John;lastName=Doe&filter=firstName==Bob | Users with: (firstName of ''John'' AND lastName of ''Doe'') OR firstName of ''Bob''. |

        | GET /v1/users?filter=location.cityName==Portland | Users with a city of ''Portland''. |

        | GET /v1/users?filter=customAttributes.internalId==12345 | Users with a custom attribute of internalId equal to 12345''. |

        | GET /v1/users?filter=lastInferredLocation.stateName==Georgia | Users with a last inferred location.stateName value of Georgia''. |

        | GET /v1/users?filter=lastVisitedUserAgentData.userAgent.browserType==firefox | Users with firefox as last visited browser across the products ''. |

        | GET /v1/users?filter=lastVisitedUserAgentData.userAgent.browserType==firefox;lastVisitedUserAgentData.propertyKey==AP-8MF5LPSWUBFW-2 | Users with firefox as last visited browser for a particular product(with property key AP-8MF5LPSWUBFW-2)''. |


        #### Supported filter fields for last inferred location

        | Field |

        | ----- |

        | lastInferredLocation.countryCode |

        | lastInferredLocation.countryName |

        | lastInferredLocation.stateCode |

        | lastInferredLocation.stateName |

        | lastInferredLocation.city |

        | lastInferredLocation.continent |

        | lastInferredLocation.postalCode |

        | lastInferredLocation.regionName |

        | lastInferredLocation.timeZone |

        | lastInferredLocation.street |


        ### Sorting

        The sort parameter accepts a list of semi-colon separated fields names, each with an optional dash to imply descending sort order.

        Examples:


        | URI | Results |

        | ----- | -------- |

        | GET /v1/users?sort=lastName;firstName | Users sorted by firstName, lastName, in ascending order. |

        | GET /v1/users?sort=-createDate | Users sorted by createDate in descending order. |'
      operationId: getUsersUsingGET
      parameters:
      - name: filter
        in: query
        description: Filters
        required: false
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: pageSize
        in: query
        description: Number of users per page
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 25
          maximum: 1000
          minimum: 1
      - name: scrollId
        in: query
        description: Used for fetching subsequent pages after the first one.  Returned in response.scrollId
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: sort
        in: query
        description: Sort fields
        required: false
        allowEmptyValue: false
        x-example: sort=+firstName;-createDate
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UsersPage'
        '400':
          description: Bad request
        '401':
          description: Unauthorized or bad API Key
        '429':
          description: Rate limit exceeded
      deprecated: false
    post:
      tags:
      - Users
      summary: Create user
      description: Creates a new user with the given data
      operationId: createUserUsingPOST
      responses:
        '201':
          description: Created User
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResponseEntity'
        '400':
          description: Bad request, possible duplicate
        '401':
          description: Unauthorized or bad API Key
        '429':
          description: Rate limit exceeded
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User_2'
        description: User data
        required: true
  /v1/users/delete:
    servers:
    - url: https://api.aptrinsic.com/
    delete:
      tags:
      - Users
      summary: Delete user (identifyId passed via request body)
      description: 'Deletes a user with identifyId specified in delete body

        This delete method is useful when the identify ID contains special characters that make it impossible to use the delete method with the identifyId in the request path.

        ### HardDelete:

        Default behavior is to mark the user as deleted, which will cause it to be hidden in the application.

        If a user with the same id is created or updated within the next 7 days,

        the previously deleted record will be revived with all of its associated event history.

        Conversely, if a user with the same ID is created after 7 days, a totally new record with no event history will be created.

        To disable the current record from being revived in the future, set the hardDelete flag to true'
      operationId: deleteUserUsingDELETE
      parameters:
      - name: hardDelete
        in: query
        description: Hard delete, do not revive if created/updated again in 7 day window
        required: false
        allowEmptyValue: false
        x-example: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Deleted
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResponseEntity'
        '204':
          description: No Content
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResponseEntity'
        '401':
          description: Unauthorized or bad API Key
        '404':
          description: User not found
        '429':
          description: Rate limit exceeded
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUser'
        description: deleteUser
        required: true
  /v1/users/denylist/{identifyId}:
    servers:
    - url: https://api.aptrinsic.com/
    get:
      tags:
      - Users
      summary: Get user Denylist flag
      description: Returns true if the user is marked as denied
      operationId: getUserDenylistFlagUsingGET
      parameters:
      - name: identifyId
        in: path
        description: User identify id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GetUserDenylistFlagResponse'
        '204':
          description: No Content
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GetUserDenylistFlagResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized or bad API Key
        '403':
          description: Access denied
        '404':
          description: User not found by id
        '429':
          description: Rate limit exceeded
      deprecated: false
    put:
      tags:
      - Users
      summary: Update user Denylist flag
      description: Setting the Denylist flag to true will make Gainsight PX to ignore all of the user's events.
      operationId: updateUserDenylistFlagUsingPUT
      parameters:
      - name: identifyId
        in: path
        description: User identify id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updated
        '204':
          description: No Content
        '400':
          description: Bad request
        '401':
          description: Unauthorized or bad API Key
        '403':
          description: Access denied
        '404':
          description: User not found by id
        '429':
          description: Rate limit exceeded
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDenylistRequestBody'
        description: Denied flag value
        required: true
  /v1/users/update:
    servers:
    - url: https://api.aptrinsic.com/
    put:
      tags:
      - Users
      summary: Update user (identifyId passed via request body)
      description: 'Updates a user with identifyId specified in the request body.

        This update method is useful when the identify ID contains special characters that make it impossible to use the update method with the identifyId in the request path.'
      operationId: updateUserUsingPUT
      responses:
        '204':
          description: Updated
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResponseEntity'
        '401':
          description: Unauthorized or bad API Key
        '404':
          description: User not found
        '429':
          description: Rate limit exceeded
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User_2'
        description: User data
        required: true
  /v1/users/{identifyId}:
    servers:
    - url: https://api.aptrinsic.com/
    get:
      tags:
      - Users
      summary: Get user
      description: Retrieves the user with the given id
      operationId: getUserUsingGET
      parameters:
      - name: identifyId
        in: path
        description: User id (from identify call)
        required: true
        x-example: jdoe@example.com
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/User_2'
        '400':
          description: Bad request
        '401':
          description: Unauthorized or bad API Key
        '404':
          description: User not found
        '429':
          description: Rate limit exceeded
      deprecated: false
    put:
      tags:
      - Users
      summary: Update user
      description: Updates an user with the given data
      operationId: updateUserUsingPUT_1
      parameters:
      - name: identifyId
        in: path
        description: User id (from identify call)
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Updated
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResponseEntity'
        '401':
          description: Unauthorized or bad API Key
        '404':
          description: User not found
        '429':
          description: Rate limit exceeded
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User_2'
        description: User data
        required: true
    delete:
      tags:
      - Users
      summary: Delete user
      description: 'Deletes a user

        ### HardDelete:

        Default behavior is to mark the user as deleted, which will cause it to be hidden in the application.

        If a user with the same id is created or updated within the next 7 days,

        the previously deleted record will be revived with all of its associated event history.

        Conversely, if a user with the same ID is created after 7 days, a totally new record with no event history will be created.

        To disable the current record from being revived in the future, set the hardDelete flag to true'
      operationId: deleteUserUsingDELETE_1
      parameters:
      - name: hardDelete
        in: query
        description: Hard delete, do not revive if created/updated again in 7 day window
        required: false
        allowEmptyValue: false
        x-example: false
        schema:
          type: boolean
          default: false
      - name: identifyId
        in: path
        description: User id (from identify call)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResponseEntity'
        '204':
          description: No Content
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResponseEntity'
        '401':
          description: Unauthorized or bad API Key
        '404':
          description: User not found
        '429':
          description: Rate limit exceeded
      deprecated: false
components:
  parameters:
    userId:
      name: userId
      in: path
      required: true
      description: Gainsight user ID
      schema:
        type: string
    userId_2:
      name: userId
      in: path
      required: true
      description: Unique user identifier
      schema:
        type: string
    scrollId:
      name: scrollId
      in: query
      description: Scroll ID for cursor-based pagination
      schema:
        type: string
    filter:
      name: filter
      in: query
      description: Filter expression for results
      schema:
        type: string
    sort:
      name: sort
      in: query
      description: Sort field and direction (e.g., lastSeenDate:desc)
      schema:
        type: string
    pageSize:
      name: pageSize
      in: query
      description: Number of results per page
      schema:
        type: integer
        default: 20
        maximum: 500
  responses:
    Unauthorized:
      description: Authentication failed or access key is missing
    BadRequest:
      description: Invalid request body or parameters
    NotFound:
      description: The requested resource was not found
    Unauthorized_2:
      description: Authentication failed or API key is missing
  schemas:
    GainsightUserInput:
      type: object
      properties:
        FirstName:
          type: string
        LastName:
          type: string
        Email:
          type: string
          format: email
        UserType:
          type: string
        LicenseType:
          type: string
        Role:
          type: string
    GainsightUser:
      type: object
      properties:
        Gsid:
          type: string
          description: User unique identifier
        FirstName:
          type: string
          description: First name
        LastName:
          type: string
          description: Last name
        Email:
          type: string
          format: email
          description: Email address
        UserType:
          type: string
          description: User type
        IsActive:
          type: boolean
          description: Whether the user is active
        LicenseType:
          type: string
          description: License type assigned
        Role:
          type: string
          description: User role
        SfdcUserId:
          type: string
          description: Salesforce user ID
        CreatedDate:
          type: string
          format: date-time
        ModifiedDate:
          type: string
          format: date-time
    ApiResponse:
      type: object
      properties:
        result:
          type: boolean
        errorCode:
          type: string
        errorDesc:
          type: string
        requestId:
          type: string
    User:
      type: object
      properties:
        aptrinsicId:
          type: string
          description: Gainsight PX internal identifier
        identifyId:
          type: string
          description: User identification string
        type:
          type: string
          description: User type
        gender:
          type: string
          description: User gender
        email:
          type: string
          format: email
          description: User email address
        firstName:
          type: string
          description: First name
        lastName:
          type: string
          description: Last name
        title:
          type: string
          description: Job title
        phone:
          type: string
          description: Phone number
        score:
          type: integer
          description: User engagement score
        role:
          type: string
          description: User role
        accountId:
          type: string
          description: Associated account ID
        numberOfVisits:
          type: integer
          description: Total number of visits
        lastSeenDate:
          type: integer
          format: int64
          description: Last seen timestamp in milliseconds
        firstVisitDate:
          type: integer
          format: int64
          description: First visit timestamp in milliseconds
        signUpDate:
          type: integer
          format: int64
          description: Sign-up timestamp in milliseconds
        customAttributes:
          type: object
          description: Custom user attributes
    UserInput:
      type: object
      required:
      - identifyId
      properties:
        identifyId:
          type: string
          description: Unique user identification string
        email:
          type: string
          format: email
          description: User email address
        firstName:
          type: string
          description: First name
        lastName:
          type: string
          description: Last name
        title:
          type: string
          description: Job title
        phone:
          type: string
          description: Phone number
        role:
          type: string
          description: User role
        accountId:
          type: string
