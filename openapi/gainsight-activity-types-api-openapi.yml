openapi: 3.1.0
info:
  title: Gainsight CS Bulk Accounts Activity Types API
  description: The Gainsight Bulk API is an asynchronous connector that automates insert or update of large data volumes from CSV files into Gainsight standard and custom objects, with rate limits of 10 calls per hour and 100 per day.
  version: '1.0'
  contact:
    name: Gainsight Support
    url: https://support.gainsight.com
    email: support@gainsight.com
  termsOfService: https://www.gainsight.com/terms-of-service/
servers:
- url: https://{domain}.gainsightcloud.com/v1
  description: Gainsight CS Production
  variables:
    domain:
      default: customer
      description: Customer-specific domain prefix
security:
- apiKey: []
tags:
- name: Activity Types
  description: Retrieve activity type configurations
paths:
  /timeline/activityTypes:
    get:
      operationId: getActivityTypes
      summary: Gainsight Get activity types
      description: Retrieve the list of configured timeline activity types.
      tags:
      - Activity Types
      responses:
        '200':
          description: Activity types returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityType'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    ActivityType:
      type: object
      properties:
        id:
          type: string
          description: Activity type identifier
        name:
          type: string
          description: Activity type name
        isSystem:
          type: boolean
          description: Whether this is a system-defined type
        isActive:
          type: boolean
          description: Whether the type is active
  responses:
    Unauthorized:
      description: Authentication failed or access key is missing
  securitySchemes:
    apiKey:
      type: apiKey
      name: accessKey
      in: header
      description: Gainsight CS REST API access key
externalDocs:
  description: Bulk API Documentation
  url: https://support.gainsight.com/gainsight_nxt/API_and_Developer_Docs/Bulk_API/Gainsight_Bulk_REST_APIs
