source: live anonymous GET of /.well-known/* across every host this record knows
description: >-
  Well-known discovery probe across the Gainsight estate. Two real documents were
  found, both on the Gainsight API gateway (gainsightcloud.com): RFC 8414 OAuth
  authorization-server metadata and RFC 9728 OAuth protected-resource metadata,
  including a resource-scoped variant for the Gainsight CS MCP server path
  (/v1/ds-mcp/mcp). The gateway answers these anonymously on every tenant host —
  companyapi. and personapi. are the two published gateway hostnames.
notes:
  - >-
    support.gainsight.com serves a 200 security.txt, but its Contact and Policy
    both point at NICE (ExpertSecurity@nice.com, expert-help.nice.com) — that is
    the disclosure programme of the documentation-platform vendor that hosts
    support.gainsight.com, not Gainsight's own. It is recorded here as observed
    and deliberately NOT credited to Gainsight as a security-disclosure surface.
  - >-
    developer-portal.gainsight.com answers 200 with the same 135 KB SPA shell for
    every /.well-known/* path. Those are catch-all false positives and are
    recorded as misses.
  - >-
    www.gainsight.com / gainsight.com sit behind a Cloudflare edge that returns
    403 to non-browser clients on every path including /.well-known/*. Not a
    measurement of absence — recorded as challenged.
  - >-
    The issuer in the gateway documents resolves to whichever tenant the gateway
    default maps to (observed sb-genesysnx-3.gainsightcloud.com). The document
    shape is tenant-templated by design; each customer tenant serves its own.
