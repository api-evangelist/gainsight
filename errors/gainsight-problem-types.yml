    occurrences: 1
  - status: 429
    title: Rate limit exceeded
    occurrences: 62
    remediation: >-
      Back off and retry. Published PX ceiling is ~200 requests/second and
      1,000,000/day; the contract declares no Retry-After or RateLimit-* header,
      so an agent must use its own backoff schedule. See
      rate-limits/gainsight-rate-limits.yml.
  - status: 500
    title: Internal error
    occurrences: 1

