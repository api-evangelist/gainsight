source: >-
  openapi/gainsight-px-rest-api-openapi.yml (4xx/5xx responses across 74
  operations), plus observed live gateway responses from
  companyapi.gainsightcloud.com
provider: Gainsight
providerId: gainsight
format: proprietary
format_note: >-
  Not RFC 9457. The PX contract declares no application/problem+json media type
  anywhere, and the Gainsight CS gateway returns its own envelope. Two different
  error shapes exist across the estate and an agent must handle both.

envelopes:
  - surface: Gainsight CS / MCP gateway (gainsightcloud.com)
    shape:
      result: boolean, false on error
      errorCode: string, e.g. GS_APIG_2401
      errorDesc: string, short human description
      requestId: string, UUID — also returned as the x-gs-request-id and x-request-id headers
      message: string
    observed:
      - status: 401
        body: '{"result":false,"errorCode":"GS_APIG_2401","errorDesc":"Unauthorized","requestId":"...","message":"Unauthorized"}'
      - status: 404
        body: '{"result":false,"errorCode":"GS_APIG_1000","errorDesc":"Not Found","requestId":"...","message":"Not Found"}'
      - status: 500
        body: '{"result":false,"errorCode":"GU_1101","errorDesc":"Oops, something went wrong...","requestId":"..."}'
    note: >-
      errorCode is the field to branch on, not the HTTP status —
      GS_APIG_1000 (route absent) and GS_APIG_2401 (route present, unauthorized)
      are what distinguish a missing endpoint from a gated one.
  - surface: Gainsight PX REST API (api.aptrinsic.com)
    shape:
      note: >-
        The contract declares response descriptions but no error schema for most
        4xx codes; CustomEventsBatchError is the one modelled error definition.
    schemas: [CustomEventsBatchError]

problem_types:
  - status: 400
    title: Bad request
    occurrences: 50
    remediation: Validate the request body against the operation schema before retrying.
  - status: 400
    title: Bad request, possible duplicate
    occurrences: 3
    remediation: >-
      The resource may already exist. Read before write — there is no
      idempotency key to make the retry safe.
  - status: 401
    title: Unauthorized or bad API Key
    occurrences: 62
    remediation: >-
      Check the X-APTRINSIC-API-KEY header and that the key's permission
      (Read / Write / Production Launch) covers this operation.
  - status: 403
    title: Access denied
    occurrences: 10
    remediation: The API key lacks the permission this operation requires.
  - status: 403
    title: Forbidden
    occurrences: 1
  - status: 404
    title: Account not found
    occurrences: 12
  - status: 404
    title: User not found by id
    occurrences: 10
  - status: 404
    title: User not found
    occurrences: 5
  - status: 404
