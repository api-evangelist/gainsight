description: >-
  First-party Gainsight client libraries and developer tooling. Three families
  ship: the Gainsight PX mobile SDKs (native iOS/Android plus React Native,
  Flutter and NativeScript bridges, all in github.com/Gainsight), the Digital
  Customer Hub / Customer Communities SDK and build tools (@gainsight-hub/*),
  and the Gainsight CS admin CLI (which also bundles a local stdio MCP server).
  No first-party server-side SDK is published for the Gainsight CS REST API or
  the Gainsight PX REST API in any registry — PyPI, Maven Central, NuGet,
  RubyGems, Packagist, crates.io and pkg.go.dev were all searched and returned
  nothing first-party.

